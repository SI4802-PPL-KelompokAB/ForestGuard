name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: forestguard_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, mysql, pdo_mysql, bcmath, fileinfo, curl
          coverage: none

      - name: Create Dusk Database
        run: |
          mysql -h 127.0.0.1 -u root -ppassword -e "CREATE DATABASE IF NOT EXISTS forestguard_dusk;"

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Setup Environment Files
        run: |
          cp .env.example .env
          php artisan key:generate
          cat << 'EOF' > .env.dusk.local
          APP_NAME=ForestGuard
          APP_ENV=dusk.local
          APP_KEY=base64:39A0yf3dwmvIc8r1BvCtgTJVis/5KvyxNlifnx/V2Bk=
          APP_DEBUG=true
          APP_TIMEZONE=Asia/Jakarta
          APP_URL=http://127.0.0.1:8000
          APP_LOCALE=id
          APP_FALLBACK_LOCALE=id
          APP_FAKER_LOCALE=id_ID
          BCRYPT_ROUNDS=4
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=forestguard_dusk
          DB_USERNAME=root
          DB_PASSWORD=password
          SESSION_DRIVER=database
          CACHE_STORE=database
          QUEUE_CONNECTION=sync
          EOF

      - name: Install NPM Dependencies & Build Assets
        run: |
          npm ci || npm install
          npm run build

      - name: Run Migrations and Seeders (Test DB)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: forestguard_test
          DB_USERNAME: root
          DB_PASSWORD: password
        run: php artisan migrate:fresh --seed --force

      - name: Run PHPUnit Tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: forestguard_test
          DB_USERNAME: root
          DB_PASSWORD: password
        run: php artisan test --compact

      - name: Setup ChromeDriver for Dusk
        run: php artisan dusk:chrome-driver --detect || true

      - name: Migrate & Seed Dusk Database
        run: php artisan migrate:fresh --seed --env=dusk.local --force

      - name: Start Application Server for Dusk
        run: php artisan serve --env=dusk.local --port=8000 &

      - name: Run Laravel Dusk Tests
        run: php artisan dusk
